name: Engineering dossier

on:
  push:
    branches: [main]
    paths:
      - "engineering-dossier/**"
      - ".github/workflows/engineering-dossier-pages.yml"
      - "package.json"
      - "scripts/validate-engineering-dossier.mjs"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    name: Package dossier
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate static dossier
        run: npm run docs:dossier:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dossier artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./engineering-dossier

  deploy:
    name: Deploy dossier
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Release container
run-name: Release container ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: container-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      APP_URL: http://localhost:42021
      AUTH_SECRET: release-auth-secret-that-is-at-least-thirty-two-characters
      SECRET_BOX_KEY: release-secret-box-key-that-is-at-least-thirty-two-characters
    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "Release tags must use vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N, for example v0.1.0-beta.1."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require release commit on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit on $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use the pinned npm release
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:dependencies

      - name: Validate documentation
        run: npm run docs:dossier:check && npm run docs:wiki:check && npm run docs:links:check

      - name: Validate migrations and module boundaries
        run: npm run migrations:check && npm run boundaries:check

      - name: Lint and typecheck
        run: npm run lint && npm run typecheck

      - name: Run application and infrastructure tests
        run: npm test && npm run test:scripts

  publish:
    name: Publish attested image to GHCR
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Nooklet
            org.opencontainers.image.description=Self-hosted media discovery and download automation

      - name: Build and publish image with attestations
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          sbom: true
          provenance: mode=max

      - name: Report published digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          {
            echo "### Published container"
            echo
            echo "Digest: \`${IMAGE_NAME}@${IMAGE_DIGEST}\`"
            echo
            echo "Tags:"
            echo '```text'
            echo "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
